name: deploy

# manual only. the gate is the 'production' environment: it holds the required
# reviewer, the branch policy and the secrets.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # to push the release tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tulaufa.ru/minecraft-admin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/tulaufa-mine ./cmd/tulaufa-mine
          ls -l dist/tulaufa-mine

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship binary and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes"

          # Land it beside the live binary, then move into place: rsync onto a
          # running executable would fail with ETXTBSY.
          rsync -avz -e "ssh $ssh_opts" dist/tulaufa-mine \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/tulaufa-mine/tulaufa-mine.new"

          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            mv /opt/tulaufa-mine/tulaufa-mine.new /opt/tulaufa-mine/tulaufa-mine
            chmod 0755 /opt/tulaufa-mine/tulaufa-mine
            sudo -n /usr/bin/systemctl restart tulaufa-mine.service
          '

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes"
          for i in $(seq 1 10); do
            if ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
                 'curl -fsS --max-time 5 http://127.0.0.1:8787/api/mc/session' | grep -q authenticated; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::service did not become healthy"
          exit 1

      - name: Tag this release
        id: tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=2
          while git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; do
            tag="$base.$n"
            n=$((n + 1))
          done
          git tag -a "$tag" -m "Deployed tulaufa-mine"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "Deployed \`$TAG\` — API healthy on 127.0.0.1:8787." >> "$GITHUB_STEP_SUMMARY"
